<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>video-dl</title>
  </head>
  <body>
    <header>
      <h1>video-dl</h1>
      <span id="status" class="dot offline" role="status"
            aria-label="Servidor no disponible" title="Estado del servidor"></span>
    </header>

    <section class="target">
      <label class="sr-only" for="url">URL del video o del curso</label>
      <div class="url-row">
        <input id="url" class="url" type="text" spellcheck="false"
               placeholder="Pegá una URL, o usá la de la pestaña actual" />
        <button id="pin" class="secondary pin" title="Fijar esta URL para las próximas veces">Fijar</button>
      </div>
      <div id="probe-result" class="probe hidden"></div>
      <button id="diagnose" class="link hidden"
              title="Prueba la página y la API con y sin sesión, y dice qué falla exactamente">¿Por qué falla? Diagnosticar</button>
      <pre id="diagnose-result" class="diag hidden"></pre>
    </section>

    <section class="controls">
      <label>
        Calidad
        <select id="quality">
          <option value="best">Mejor disponible</option>
          <option value="1080">1080p máx.</option>
          <option value="720">720p máx.</option>
          <option value="480">480p máx.</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="cookies" checked /> Usar cookies del navegador</label>
      <label class="check"><input type="checkbox" id="subtitles" /> Descargar subtítulos</label>
      <label class="check"><input type="checkbox" id="audio" /> Solo audio (mp3)</label>
    </section>

    <section class="actions">
      <button id="probe" class="secondary">Analizar</button>
      <button id="download" class="primary">Descargar</button>
    </section>

    <button id="download-course" class="primary full hidden"></button>

    <div id="message" class="message hidden" role="status" aria-live="polite"></div>

    <section class="jobs">
      <div class="jobs-head">
        <h2>Descargas</h2>
        <div class="jobs-acciones">
          <button id="refresh-session" class="link hidden"
                  title="Vuelve a leer tus cookies del navegador y se las pasa a las clases que faltan">Actualizar sesión</button>
          <button id="cancel-all" class="link hidden">Cancelar todo</button>
          <button id="clear" class="link">Limpiar terminadas</button>
        </div>
      </div>
      <ul id="job-list"></ul>
    </section>

    <footer>
      <span id="ruta" class="ruta" title="Carpeta de descargas"></span>
      <a href="#" id="options">Opciones</a>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
